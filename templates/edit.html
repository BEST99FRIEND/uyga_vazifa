<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>Todo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete Todo</title>
</head>
<body>

    {% if message %}
    <p> {{message}} </p>
    {% endif %}

    {% if todo %}
        <form action="/edit/{{todo.id}}/" method="post">
            {% csrf_token %}
            <p>{{todo.title}} ni rostdan ham tahrirlamoqchimisiz?</p>
            <button type="submit">Ha</button>
            <a href="/"><button type="button">Yo'q, bekor qilish</button></a>
        </form>
    {% endif %}

</body>
</html>
